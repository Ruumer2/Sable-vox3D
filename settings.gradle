pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        maven { url = uri("https://maven.fabricmc.net/") }
        maven { url = uri("https://maven.neoforged.net/releases") }
    }
    plugins {
        id 'net.neoforged.moddev' version '2.0.78'
        id 'fabric-loom' version '1.16.3'
    }
}

rootProject.name = 'sable-vox3d'

include 'common'
include 'fabric'
include 'neoforge'
