def nativeSourceDir = file('native').exists() ? file('native') : (file('natives').exists() ? file('natives') : file('native'))
def nativeBuildDir = new File(nativeSourceDir, 'build')

def configureNativeRelease = tasks.register('configureNativeRelease', Exec) {
    group = 'build'
    description = 'Configures the platform-native Vox3D bridge.'
    inputs.file(new File(nativeSourceDir, 'CMakeLists.txt'))
    outputs.file(new File(nativeBuildDir, 'CMakeCache.txt'))
    commandLine 'cmake', '-S', nativeSourceDir.absolutePath, '-B', nativeBuildDir.absolutePath,
            '-DCMAKE_BUILD_TYPE=Release'
}

def buildNativeRelease = tasks.register('buildNativeRelease', Exec) {
    group = 'build'
    description = 'Builds and copies the platform-native Vox3D bridge into common resources.'
    dependsOn configureNativeRelease
    inputs.files(fileTree(nativeSourceDir) {
        exclude 'build/**'
        exclude '.git/**'
    }).withPropertyName("nativeSourceFiles")
    outputs.dir(file('common/src/main/resources/natives')).withPropertyName("nativeResourceDir")
    commandLine 'cmake', '--build', nativeBuildDir.absolutePath, '--config', 'Release',
            '--target', 'package_sable_vox3d_native'
}

gradle.projectsEvaluated {
    [project(':common'), project(':fabric'), project(':neoforge')].each { targetProject ->
        targetProject.tasks.matching { it.name in ['processResources', 'sourcesJar', 'jar'] }.configureEach {
            dependsOn(buildNativeRelease)
        }
    }
}

tasks.register('buildAllNatives', Exec) {
    group = 'build'
    description = 'Builds multiplatform native binaries (Linux x86_64/aarch64, macOS x86_64/aarch64, Windows aarch64) using Zig/WSL.'
    def scriptPath = file('native/build_all_natives.sh').absolutePath.replace('\\', '/')
    def wslPath = scriptPath.replaceFirst('^([A-Za-z]):', { all, drive -> "/mnt/${drive.toLowerCase()}" })
    commandLine 'wsl', '-d', 'Ubuntu-24.04', '--', 'bash', '-c', "bash '${wslPath}'"
}

tasks.register('releaseBuild') {
    group = 'build'
    description = 'Builds all native bridges before packaging both loader jars.'
    dependsOn buildAllNatives, buildNativeRelease, ':fabric:build', ':neoforge:build'
}

