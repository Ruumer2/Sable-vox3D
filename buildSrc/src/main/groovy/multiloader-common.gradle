plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }
    maven {
        name = "Create Mod Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Tterrag Maven"
        url = "https://maven.tterrag.com"
    }
    maven {
        name = "CurseForge Maven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "FirstDarkDev Snapshots"
        url = "https://maven.firstdarkdev.xyz/snapshots"
    }
    maven {
        name = "DevOS Snapshots"
        url = "https://mvn.devos.one/snapshots/"
    }
    maven {
        name = "DevOS Releases"
        url = "https://mvn.devos.one/releases/"
    }
}

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            "version"                      : version,
            "group"                        : project.group,
            "minecraft_version"            : minecraft_version,
            "minecraft_version_range"      : findProperty("minecraft_version_range") ?: "[1.21.1]",
            "fabric_version"               : findProperty("fabric_version") ?: "0.110.0+1.21.1",
            "fabric_loader_version"        : findProperty("fabric_loader_version") ?: "0.16.9",
            "neoforge_version"             : findProperty("neoforge_version") ?: "21.1.77",
            "neoforge_loader_version_range": findProperty("neoforge_loader_version_range") ?: "[4,)",
            "mod_name"                     : mod_name,
            "mod_author"                   : mod_author,
            "mod_id"                       : mod_id,
            "license"                      : license,
            "description"                  : project.description ?: description,
            "credits"                      : credits,
            "java_version"                 : java_version,
            "sable_version"                : sable_version,
            "sable_min_version"            : sable_min_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv("local_maven_url")
        }
    }
}
