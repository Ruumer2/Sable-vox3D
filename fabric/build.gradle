    maven { url = uri("https://maven.parchmentmc.org") }
    maven { url = uri("https://maven.createmod.net") }
    maven { url = uri("https://mvn.devos.one/snapshots/") }
    maven { url = uri("https://mvn.devos.one/releases/") }
    maven { url = uri("https://maven.tterrag.com") }
    maven { url = uri("https://cursemaven.com") }
    maven { url = uri("https://maven.firstdarkdev.xyz/snapshots") }
}

dependencies {
    modImplementation "dev.ryanhcode.sable:sable-fabric-${minecraft_version}:${sable_version}"
}
